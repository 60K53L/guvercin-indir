<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Güvercin — Yeni Şifre Belirleme</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    :root {
      --bg: #14171f;
      --card: #1b202c;
      --border: #2a3142;
      --text: #e6e8ee;
      --muted: #8b92a5;
      --accent: #e5a93c;
      --accent-hover: #d4952b;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .user-badge {
      background: rgba(229, 169, 60, 0.1);
      border: 1px solid rgba(229, 169, 60, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      word-break: break-all;
    }
    .field {
      margin-bottom: 16px;
    }
    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      text-transform: none;
    }
    .toggle-btn:hover { color: var(--text); }
    input {
      width: 100%;
      padding: 11px 12px;
      background: #12151c;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #12151c;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #232938;
      color: var(--text);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: #2c3447; }
    .msg {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--success); }
    .msg.info { color: var(--muted); }
    .loading-spinner {
      text-align: center;
      padding: 24px 0;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">GÜVERCİN</div>
    <div class="subtitle">Yeni Şifre Belirleme</div>

    <div id="loading" class="loading-spinner">
      Bağlantı kontrol ediliyor, lütfen bekleyin…
    </div>

    <div id="error-box" style="display: none;">
      <div class="msg error" id="init-error-msg"></div>
      <a href="/" class="btn btn-secondary" style="display: block; text-align: center; text-decoration: none; margin-top: 16px;">
        Giriş Ekranına Dön
      </a>
    </div>

    <form id="reset-form" style="display: none;" onsubmit="handleSubmit(event)">
      <div class="user-badge" id="user-badge">
        <span>👤</span>
        <strong id="user-email"></strong>
      </div>

      <div class="field">
        <div class="field-header">
          <label for="pass1">Yeni Şifre</label>
          <button type="button" class="toggle-btn" onclick="togglePass('pass1', this)">👁️ Şifreyi Göster</button>
        </div>
        <input type="password" id="pass1" placeholder="En az 6 karakter" autocomplete="new-password" required minlength="6">
      </div>

      <div class="field">
        <div class="field-header">
          <label for="pass2">Yeni Şifre (Tekrar)</label>
          <button type="button" class="toggle-btn" onclick="togglePass('pass2', this)">👁️ Şifreyi Göster</button>
        </div>
        <input type="password" id="pass2" placeholder="Şifrenizi tekrar girin" autocomplete="new-password" required minlength="6">
      </div>

      <div class="msg error" id="form-error" style="display: none;"></div>

      <button type="submit" id="submit-btn" class="btn">
        Şifreyi Güncelle
      </button>
    </form>

    <div id="success-box" style="display: none; text-align: center;">
      <div style="font-size: 40px; margin-bottom: 12px;">✅</div>
      <div class="msg success" style="font-size: 15px; font-weight: 600; margin-bottom: 8px;">
        Şifreniz Başarıyla Değiştirildi!
      </div>
      <p style="color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 16px 0;">
        Yeni şifrenizle tüm cihazlarınızdan güvenle giriş yapabilirsiniz.
      </p>
      <a href="/" class="btn" style="display: block; text-decoration: none;">
        Giriş Yap
      </a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js'
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset,
      isSignInWithEmailLink,
      signInWithEmailLink,
      updatePassword
    } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js'

    const firebaseConfig = {
      apiKey: 'AIzaSyDdLrtoZo7I1H_vJlFrW5KLLE6C10RamcU',
      authDomain: 'guvercin-beta-dev.firebaseapp.com',
      projectId: 'guvercin-beta-dev',
      storageBucket: 'guvercin-beta-dev.firebasestorage.app',
      messagingSenderId: '633405170493',
      appId: '1:633405170493:web:e73c6a293bcd057f551b54'
    }

    const app = initializeApp(firebaseConfig)
    const auth = getAuth(app)

    const urlParams = new URLSearchParams(window.location.search)
    const oobCode = urlParams.get('oobCode')

    const loadingEl = document.getElementById('loading')
    const errorBox = document.getElementById('error-box')
    const initErrorMsg = document.getElementById('init-error-msg')
    const resetForm = document.getElementById('reset-form')
    const userEmailEl = document.getElementById('user-email')
    const formError = document.getElementById('form-error')
    const submitBtn = document.getElementById('submit-btn')
    const successBox = document.getElementById('success-box')

    let isMagicLink = false

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id)
      if (input.type === 'password') {
        input.type = 'text'
        btn.textContent = '🙈 Gizle'
      } else {
        input.type = 'password'
        btn.textContent = '👁️ Göster'
      }
    }

    if (isSignInWithEmailLink(auth, window.location.href)) {
      isMagicLink = true
      let email = window.localStorage ? window.localStorage.getItem('emailForSignIn') : ''
      if (!email) {
        email = window.prompt('Lütfen doğrulama için kayıtlı e-posta adresinizi giriniz:')
      }
      if (email) {
        signInWithEmailLink(auth, email, window.location.href)
          .then(result => {
            loadingEl.style.display = 'none'
            userEmailEl.textContent = result.user.email
            resetForm.style.display = 'block'
            if (window.localStorage) window.localStorage.removeItem('emailForSignIn')
          })
          .catch(err => {
            loadingEl.style.display = 'none'
            errorBox.style.display = 'block'
            initErrorMsg.textContent = 'Hızlı giriş bağlantısı geçersiz veya süresi dolmuş. Lütfen uygulamadan yeni bir bağlantı isteyin.'
          })
      } else {
        loadingEl.style.display = 'none'
        errorBox.style.display = 'block'
        initErrorMsg.textContent = 'E-posta adresi girilmediği için işlem doğrulanamadı.'
      }
    } else if (oobCode) {
      verifyPasswordResetCode(auth, oobCode)
        .then(email => {
          loadingEl.style.display = 'none'
          userEmailEl.textContent = email
          resetForm.style.display = 'block'
        })
        .catch(err => {
          loadingEl.style.display = 'none'
          errorBox.style.display = 'block'
          initErrorMsg.textContent = 'Bu şifre sıfırlama bağlantısının süresi dolmuş veya bağlantı daha önce kullanılmış. Lütfen uygulamadan tekrar yeni bir sıfırlama bağlantısı talep edin.'
        })
    } else {
      loadingEl.style.display = 'none'
      errorBox.style.display = 'block'
      initErrorMsg.textContent = 'Geçersiz veya eksik şifre sıfırlama bağlantısı. Lütfen e-postanızdaki bağlantıyı eksiksiz açtığınızdan emin olun.'
    }

    window.handleSubmit = async function(e) {
      e.preventDefault()
      formError.style.display = 'none'

      const p1 = document.getElementById('pass1').value
      const p2 = document.getElementById('pass2').value

      if (p1.length < 6) {
        formError.textContent = 'Şifre en az 6 karakter olmalı.'
        formError.style.display = 'block'
        return
      }

      if (p1 !== p2) {
        formError.textContent = 'Şifreler eşleşmiyor! Lütfen iki kutucuğa da aynı şifreyi yazdığınızdan emin olun.'
        formError.style.display = 'block'
        return
      }

      submitBtn.disabled = true
      submitBtn.textContent = 'Kaydediliyor…'

      try {
        if (isMagicLink) {
          await updatePassword(auth.currentUser, p1)
        } else {
          await confirmPasswordReset(auth, oobCode, p1)
        }
        resetForm.style.display = 'none'
        successBox.style.display = 'block'
      } catch (err) {
        submitBtn.disabled = false
        submitBtn.textContent = 'Şifreyi Güncelle'
        formError.textContent = 'Şifre güncellenirken bir hata oluştu: ' + (err.message || 'Lütfen tekrar deneyin.')
        formError.style.display = 'block'
      }
    }
  </script>
</body>
</html>
